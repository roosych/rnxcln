name: rynexclean

services:

  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rynexclean}
      DB_USERNAME: ${DB_USERNAME:-rynexclean}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-rynexclean}
      MARIADB_USER: ${DB_USERNAME:-rynexclean}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    ports:
      # Host port is 3307 so it does not clash with a local mysql on 3306.
      # Bound to localhost only — this is for host-side `mysql`/tinker access
      # during dev, not for exposing the DB on the public network in prod.
      - "127.0.0.1:${DB_PORT_HOST:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
