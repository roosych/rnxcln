; Development-leaning defaults. Tighten opcache validate_timestamps for production.
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120

; Don't advertise the exact PHP version in the X-Powered-By response header.
expose_php = Off

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

date.timezone = America/Chicago
